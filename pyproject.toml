[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1", "setuptools_scm==8.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogames"
description = "Tombstone for cogames; retired in favor of coworld."
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
  "Development Status :: 7 - Inactive",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cogames"]

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
tag_regex = "^cogames-v(?P<version>\\d+\\.\\d+\\.\\d+(?:\\.\\d+)?)$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
root = "../.."
fallback_version = "0.0.0"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "cogames-v*"]

[tool.ruff]
extend = "../../.ruff.toml"
